<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KillaDome Emblem Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- THEME & LAYOUT --- */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0f0f0f;
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        /* HEADER AREA */
        .header-bar {
            width: 98%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        h1 {
            font-family: 'Black Ops One', cursive;
            color: #ce422b;
            margin: 0;
            letter-spacing: 2px;
            font-size: 24px;
        }

        .status-badge {
            background: #222;
            padding: 5px 15px;
            border-radius: 4px;
            border: 1px solid #333;
            font-size: 0.8rem;
            color: #777;
        }
        .status-badge.connected {
            color: #4caf50;
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        /* WORKSPACE */
        .workspace {
            display: flex;
            width: 98%;
            height: calc(100vh - 80px);
            gap: 15px;
        }

        /* --- COLUMN 1: ASSETS (LEFT) --- */
        .panel-left {
            width: 320px;
            background: #1a1a1a;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            background: #252525;
            padding: 10px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: #fff;
            text-align: center;
        }
        
        /* Category tabs */
        .category-tabs {
            display: flex;
            background: #1f1f1f;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
        }
        .category-tab {
            flex: 1;
            padding: 8px 5px;
            text-align: center;
            cursor: pointer;
            font-size: 0.65rem;
            color: #888;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            min-width: 60px;
        }
        .category-tab:hover { color: #fff; background: #2a2a2a; }
        .category-tab.active { color: #ce422b; border-bottom-color: #ce422b; background: #252525; }
        
        .asset-grid {
            padding: 10px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            flex: 1;
        }
        .asset-btn {
            aspect-ratio: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .asset-btn:hover { background: #444; border-color: #ce422b; }
        .asset-btn svg { width: 70%; height: 70%; fill: #aaa; pointer-events: none; }

        /* --- COLUMN 2: CANVAS (CENTER) --- */
        .panel-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            padding-top: 20px;
            background: #111;
            border: 1px solid #222;
        }

        .canvas-container-outer {
            border: 2px solid #ce422b;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            background: #222;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            border-right: 1px solid #444;
            padding-right: 10px;
        }
        .tool-group:last-child { border: none; }
        .tool-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #888;
        }
        
        input[type="color"] { background: none; border: 1px solid #444; width: 28px; height: 28px; cursor: pointer; border-radius: 4px; }
        input[type="range"] { width: 80px; cursor: pointer; }
        input[type="number"] { width: 50px; background: #333; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 3px; }
        
        button.action-btn {
            background: #444; border: none; color: white;
            padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.75rem;
        }
        button.action-btn:hover { background: #666; }
        button.save-btn { background: #ce422b; }
        button.save-btn:hover { background: #e05e46; }
        button.upload-btn { background: #2980b9; }
        button.upload-btn:hover { background: #3498db; }

        /* --- COLUMN 3: PROPERTIES & LAYERS (RIGHT) --- */
        .panel-right {
            width: 280px;
            background: #1a1a1a;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        
        /* Properties Panel */
        .properties-section {
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        .prop-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .prop-label {
            width: 70px;
            font-size: 0.75rem;
            color: #888;
        }
        .prop-input {
            flex: 1;
            background: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 5px;
            border-radius: 3px;
            font-size: 0.8rem;
        }
        
        .layers-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        
        .layer-item {
            display: flex; align-items: center; padding: 8px 10px; background: #222;
            border-bottom: 1px solid #333; cursor: pointer; user-select: none; font-size: 0.8rem;
        }
        .layer-item:hover { background: #2a2a2a; }
        .layer-item.active { background: #3d3d3d; border-left: 3px solid #ce422b; }
        
        .layer-name { flex: 1; margin-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .layer-icon { width: 20px; height: 20px; background: #444; border-radius: 3px; }
        .layer-actions { display: flex; gap: 5px; opacity: 0.5; }
        .layer-item:hover .layer-actions { opacity: 1; }
        
        .mini-btn {
            background: none; border: 1px solid #555; color: #aaa;
            width: 20px; height: 20px; font-size: 10px; cursor: pointer; border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
        }
        .mini-btn:hover { background: #444; }
        .mini-btn.del:hover { background: #a00; color: #fff; border-color: #a00; }
        
        /* Hidden file input */
        #imageUpload { display: none; }

    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🎮 KillaDome Emblem Editor</h1>
        <div id="statusBadge" class="status-badge">Guest Mode (Not Linked)</div>
    </div>

    <div class="workspace">
        
        <div class="panel-left">
            <div class="panel-header">🎨 Decal Library</div>
            <div class="category-tabs">
                <div class="category-tab active" data-category="basic" onclick="showCategory('basic')">Basic</div>
                <div class="category-tab" data-category="military" onclick="showCategory('military')">Military</div>
                <div class="category-tab" data-category="symbols" onclick="showCategory('symbols')">Symbols</div>
                <div class="category-tab" data-category="badges" onclick="showCategory('badges')">Badges</div>
            </div>
            <div class="asset-grid" id="assetGrid"></div>
        </div>

        <div class="panel-center">
            <div class="canvas-container-outer">
                <canvas id="c" width="1133" height="207"></canvas>
            </div>

            <div class="toolbar">
                <div class="tool-group">
                    <span class="tool-label">Fill</span>
                    <input type="color" id="colorInput" onchange="updateColor(this.value)" value="#ffffff">
                </div>
                <div class="tool-group">
                    <span class="tool-label">Stroke</span>
                    <input type="color" id="strokeInput" onchange="updateStroke(this.value)" value="#000000">
                    <input type="number" id="strokeWidth" value="0" min="0" max="20" style="width:40px" onchange="updateStrokeWidth(this.value)">
                </div>
                <div class="tool-group">
                    <span class="tool-label">Opacity</span>
                    <input type="range" id="opacityInput" min="0" max="100" value="100" onchange="updateOpacity(this.value)">
                </div>
                <div class="tool-group">
                    <span class="tool-label">BG</span>
                    <input type="color" id="bgColorInput" onchange="updateBgColor(this.value)" value="#000000">
                </div>
                <div class="tool-group">
                    <button class="action-btn" onclick="bringForward()">▲</button>
                    <button class="action-btn" onclick="sendBackward()">▼</button>
                    <button class="action-btn" onclick="duplicateObject()">⧉</button>
                    <button class="action-btn" onclick="flipHorizontal()">↔</button>
                    <button class="action-btn" onclick="flipVertical()">↕</button>
                    <button class="action-btn" onclick="deleteSelected()">🗑</button>
                </div>
            </div>
            
            <div class="toolbar">
                <input type="file" id="imageUpload" accept="image/*" onchange="uploadImage(event)">
                <button class="action-btn upload-btn" onclick="document.getElementById('imageUpload').click()">📷 Add Image</button>
                <button class="action-btn" onclick="addText()">✏ Add Text</button>
                <button class="action-btn" onclick="clearCanvas()">🗑 Clear All</button>
                <button class="action-btn save-btn" onclick="exportImage()">💾 SAVE CARD</button>
            </div>
        </div>

        <div class="panel-right">
            <div class="panel-header">⚙ Properties</div>
            <div class="properties-section" id="propertiesPanel">
                <div class="prop-row">
                    <span class="prop-label">X Position</span>
                    <input type="number" class="prop-input" id="propX" onchange="updatePosition()">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Y Position</span>
                    <input type="number" class="prop-input" id="propY" onchange="updatePosition()">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Width</span>
                    <input type="number" class="prop-input" id="propW" onchange="updateSize()">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Height</span>
                    <input type="number" class="prop-input" id="propH" onchange="updateSize()">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Rotation</span>
                    <input type="number" class="prop-input" id="propAngle" onchange="updateRotation()" min="-360" max="360">
                </div>
            </div>
            <div class="panel-header">📚 Layers</div>
            <div class="layers-list" id="layersList"></div>
        </div>
    </div>

        // ===========================================
        // 3. FABRIC JS INIT
        // ===========================================
        const canvas = new fabric.Canvas('c', {
            preserveObjectStacking: true, 
            backgroundColor: '#000000'
        });

        // ===========================================
        // 4. UI FUNCTIONS
        // ===========================================
        function showCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.category === category);
            });
            const assetGrid = document.getElementById('assetGrid');
            assetGrid.innerHTML = '';
            const assets = svgCategories[category] || [];
            assets.forEach(asset => {
                const btn = document.createElement('div');
                btn.className = 'asset-btn';
                btn.title = asset.name;
                btn.innerHTML = '<svg viewBox="0 0 512 512"><path d="' + asset.path + '"></path></svg>';
                btn.onclick = function() { addShape(asset.path, asset.name); };
                assetGrid.appendChild(btn);
            });
        }

        canvas.on('selection:created', function() { updateLayersPanel(); syncTools(); });
        canvas.on('selection:updated', function() { updateLayersPanel(); syncTools(); });
        canvas.on('selection:cleared', function() { updateLayersPanel(); clearProperties(); });
        canvas.on('object:modified', function() { updateLayersPanel(); syncTools(); });
        canvas.on('object:scaling', syncTools);
        canvas.on('object:moving', syncTools);
        canvas.on('object:rotating', syncTools);

        // ===========================================
        // 5. SHAPE & OBJECT FUNCTIONS
        // ===========================================
        function addShape(pathData, name) {
            var color = document.getElementById('colorInput').value;
            var svgString = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="' + pathData + '" fill="' + color + '"></path></svg>';
            fabric.loadSVGFromString(svgString, function(objects, options) {
                var loadedObject = fabric.util.groupSVGElements(objects, options);
                loadedObject.set({
                    left: canvas.width / 2, top: canvas.height / 2,
                    originX: 'center', originY: 'center',
                    scaleX: 0.15, scaleY: 0.15,
                    fill: color,
                    layerName: name || "Shape"
                });
                canvas.add(loadedObject);
                canvas.setActiveObject(loadedObject);
                canvas.renderAll();
                updateLayersPanel();
            });
        }
        
        function addText() {
            var text = new fabric.IText('TEXT', {
                left: canvas.width / 2,
                top: canvas.height / 2,
                originX: 'center',
                originY: 'center',
                fontSize: 40,
                fill: document.getElementById('colorInput').value,
                fontFamily: 'Arial Black',
                layerName: 'Text'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
            canvas.renderAll();
            updateLayersPanel();
        }
        
        function uploadImage(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                fabric.Image.fromURL(e.target.result, function(img) {
                    var scale = Math.min(
                        (canvas.width * 0.5) / img.width,
                        (canvas.height * 0.8) / img.height
                    );
                    img.set({
                        left: canvas.width / 2,
                        top: canvas.height / 2,
                        originX: 'center',
                        originY: 'center',
                        scaleX: scale,
                        scaleY: scale,
                        layerName: 'Image'
                    });
                    canvas.add(img);
                    canvas.setActiveObject(img);
                    canvas.renderAll();
                    updateLayersPanel();
                });
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function updateLayersPanel() {
            var layersListEl = document.getElementById('layersList');
            layersListEl.innerHTML = '';
            var objects = canvas.getObjects();
            if(objects.length === 0) {
                layersListEl.innerHTML = '<div style="padding:20px; text-align:center; color:#555; font-size:0.8rem;">No layers yet</div>';
                return;
            }
            for (var i = objects.length - 1; i >= 0; i--) {
                var obj = objects[i];
                var isActive = (canvas.getActiveObject() === obj);
                var item = document.createElement('div');
                item.className = 'layer-item' + (isActive ? ' active' : '');
                (function(o) {
                    item.onclick = function(e) {
                        if(e.target.tagName === 'BUTTON') return;
                        canvas.setActiveObject(o);
                        canvas.renderAll();
                        updateLayersPanel();
                        syncTools();
                    };
                })(obj);
                var icon = document.createElement('div');
                icon.className = 'layer-icon';
                icon.style.backgroundColor = obj.fill || '#fff';
                var name = document.createElement('span');
                name.className = 'layer-name';
                name.innerText = obj.layerName || ('Layer ' + i);
                var actions = document.createElement('div');
                actions.className = 'layer-actions';
                var btnUp = document.createElement('button');
                btnUp.className = 'mini-btn';
                btnUp.innerText = '▲';
                (function(o) { btnUp.onclick = function() { canvas.bringForward(o); updateLayersPanel(); }; })(obj);
                var btnDown = document.createElement('button');
                btnDown.className = 'mini-btn';
                btnDown.innerText = '▼';
                (function(o) { btnDown.onclick = function() { canvas.sendBackwards(o); updateLayersPanel(); }; })(obj);
                var btnDel = document.createElement('button');
                btnDel.className = 'mini-btn del';
                btnDel.innerText = '✕';
                (function(o) { btnDel.onclick = function() { canvas.remove(o); updateLayersPanel(); }; })(obj);
                actions.appendChild(btnUp);
                actions.appendChild(btnDown);
                actions.appendChild(btnDel);
                item.appendChild(icon);
                item.appendChild(name);
                item.appendChild(actions);
                layersListEl.appendChild(item);
            }
        }

        function syncTools() {
            var active = canvas.getActiveObject();
            if(!active) return;
            if(typeof active.fill === 'string') {
                document.getElementById('colorInput').value = active.fill;
            }
            if(active.stroke) {
                document.getElementById('strokeInput').value = active.stroke;
            }
            document.getElementById('strokeWidth').value = active.strokeWidth || 0;
            document.getElementById('opacityInput').value = (active.opacity || 1) * 100;
            document.getElementById('propX').value = Math.round(active.left || 0);
            document.getElementById('propY').value = Math.round(active.top || 0);
            document.getElementById('propW').value = Math.round((active.width || 0) * (active.scaleX || 1));
            document.getElementById('propH').value = Math.round((active.height || 0) * (active.scaleY || 1));
            document.getElementById('propAngle').value = Math.round(active.angle || 0);
        }
        
        function clearProperties() {
            document.getElementById('propX').value = '';
            document.getElementById('propY').value = '';
            document.getElementById('propW').value = '';
            document.getElementById('propH').value = '';
            document.getElementById('propAngle').value = '';
        }

        function updateColor(val) {
            var active = canvas.getActiveObject();
            if(active) { active.set('fill', val); canvas.renderAll(); updateLayersPanel(); }
        }
        function updateStroke(val) {
            var active = canvas.getActiveObject();
            if(active) { active.set('stroke', val); canvas.renderAll(); }
        }
        function updateStrokeWidth(val) {
            var active = canvas.getActiveObject();
            if(active) { active.set('strokeWidth', parseInt(val) || 0); canvas.renderAll(); }
        }
        function updateOpacity(val) {
            var active = canvas.getActiveObject();
            if(active) { active.set('opacity', val / 100); canvas.renderAll(); }
        }
        function updateBgColor(val) {
            canvas.backgroundColor = val; canvas.renderAll();
        }
        function bringForward() {
            var active = canvas.getActiveObject();
            if(active) { canvas.bringForward(active); updateLayersPanel(); }
        }
        function sendBackward() {
            var active = canvas.getActiveObject();
            if(active) { canvas.sendBackwards(active); updateLayersPanel(); }
        }
        function duplicateObject() {
            var active = canvas.getActiveObject();
            if(!active) return;
            active.clone(function(cloned) {
                cloned.set({ left: cloned.left + 20, top: cloned.top + 20, layerName: (active.layerName || 'Shape') + ' Copy' });
                canvas.add(cloned);
                canvas.setActiveObject(cloned);
                canvas.renderAll();
                updateLayersPanel();
            });
        }
        function flipHorizontal() {
            var active = canvas.getActiveObject();
            if(active) { active.set('flipX', !active.flipX); canvas.renderAll(); }
        }
        function flipVertical() {
            var active = canvas.getActiveObject();
            if(active) { active.set('flipY', !active.flipY); canvas.renderAll(); }
        }
        function deleteSelected() {
            var active = canvas.getActiveObject();
            if(active) { canvas.remove(active); updateLayersPanel(); }
        }
        function clearCanvas() {
            if(confirm('Clear all layers?')) {
                canvas.clear();
                canvas.backgroundColor = document.getElementById('bgColorInput').value;
                canvas.renderAll();
                updateLayersPanel();
            }
        }
        function updatePosition() {
            var active = canvas.getActiveObject();
            if(!active) return;
            active.set({
                left: parseInt(document.getElementById('propX').value) || 0,
                top: parseInt(document.getElementById('propY').value) || 0
            });
            canvas.renderAll();
        }
        function updateSize() {
            var active = canvas.getActiveObject();
            if(!active) return;
            var newW = parseInt(document.getElementById('propW').value) || active.width;
            var newH = parseInt(document.getElementById('propH').value) || active.height;
            active.set({
                scaleX: newW / active.width,
                scaleY: newH / active.height
            });
            canvas.renderAll();
        }
        function updateRotation() {
            var active = canvas.getActiveObject();
            if(!active) return;
            active.set('angle', parseInt(document.getElementById('propAngle').value) || 0);
            canvas.renderAll();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if(e.target.tagName === 'INPUT') return;
            if(e.key === 'Delete' || e.key === 'Backspace') { deleteSelected(); }
            if(e.ctrlKey && e.key === 'd') { e.preventDefault(); duplicateObject(); }
        });

        // ===========================================
        // 6. EXPORT / BRIDGE LOGIC
        // ===========================================
        function exportImage() {
            var steamId = currentUserSteamId;
            if (!steamId) {
                steamId = prompt("No SteamID detected. Please enter your Steam64 ID:");
            }
            if (!steamId) return;
            canvas.discardActiveObject();
            canvas.requestRenderAll();
            var dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 1 });
            var saveBtn = document.querySelector('.save-btn');
            var originalText = saveBtn.innerText;
            saveBtn.innerText = "⏳ SENDING...";
            saveBtn.disabled = true;
            fetch(BRIDGE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ steamId: steamId, imageData: dataURL })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                alert('✓ Success! Emblem saved for SteamID: ' + steamId);
                saveBtn.innerText = "✓ SENT!";
                setTimeout(function() {
                    saveBtn.innerText = originalText;
                    saveBtn.disabled = false;
                }, 2000);
            })
            .catch(function(error) {
                console.error('Error:', error);
                alert("❌ Connection Failed.\n\nIs the server running?");
                saveBtn.innerText = originalText;
                saveBtn.disabled = false;
            });
        }
    </script>
