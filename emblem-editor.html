<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Emblem Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-panel: #12121a;
            --bg-card: #1a1a25;
            --bg-hover: #252535;
            --accent: #ff4444;
            --accent-glow: rgba(255, 68, 68, 0.3);
            --text: #ffffff;
            --text-dim: #888899;
            --border: #2a2a3a;
            --success: #44ff88;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(180deg, #1a1a25 0%, #0a0a0f 100%);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }
        .status {
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            border: 1px solid var(--border);
        }
        .status.connected { border-color: var(--success); color: var(--success); }
        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }
        .sidebar {
            width: 280px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
            color: var(--text-dim);
        }
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 5px;
            border-bottom: 1px solid var(--border);
        }
        .cat-tab {
            flex: 1;
            min-width: 60px;
            padding: 8px 5px;
            text-align: center;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            background: var(--bg-card);
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .cat-tab:hover { background: var(--bg-hover); }
        .cat-tab.active { 
            border-color: var(--accent); 
            color: var(--accent);
            background: rgba(255,68,68,0.1);
        }
        .shape-grid {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .shape-btn {
            aspect-ratio: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .shape-btn:hover { 
            border-color: var(--accent); 
            background: var(--bg-hover);
            transform: scale(1.05);
        }
        .shape-btn svg { width: 60%; height: 60%; fill: #aaa; }
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #08080c;
            padding: 20px;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-panel);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .tool-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; }
        input[type="color"] { 
            width: 30px; 
            height: 30px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            background: var(--bg-card);
        }
        input[type="range"] { width: 80px; cursor: pointer; }
        input[type="number"] {
            width: 50px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
        }
        select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); }
        .btn.primary:hover { background: #ff6666; }
        .canvas-wrapper {
            border: 2px solid var(--accent);
            box-shadow: 0 0 40px var(--accent-glow);
        }
        .right-panel {
            width: 260px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .panel-section {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }
        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .prop-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .prop-label { width: 60px; font-size: 12px; color: var(--text-dim); }
        .prop-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        .layers-list {
            flex: 1;
            overflow-y: auto;
        }
        .layer-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .layer-item:hover { background: var(--bg-hover); }
        .layer-item.active { background: rgba(255,68,68,0.1); border-left: 3px solid var(--accent); }
        .layer-icon { width: 20px; height: 20px; background: #444; border-radius: 3px; margin-right: 10px; }
        .layer-name { flex: 1; font-size: 13px; }
        .layer-btns { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
        .layer-item:hover .layer-btns { opacity: 1; }
        .mini-btn {
            width: 22px;
            height: 22px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }
        .mini-btn:hover { border-color: var(--accent); color: var(--text); }
        .mini-btn.del:hover { background: #ff4444; border-color: #ff4444; }
        #imageUpload { display: none; }
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .preview-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        .preview-modal.active { display: flex; }
        .preview-img { max-width: 80%; max-height: 50%; border: 2px solid var(--accent); }
        @media (max-width: 1200px) {
            .main-container { flex-direction: column; }
            .sidebar, .right-panel { width: 100%; max-height: 40vh; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-size: 16px;">Saving emblem...</div>
    </div>
    <div class="preview-modal" id="previewModal">
        <h2>Preview Emblem</h2>
        <img id="previewImg" class="preview-img">
        <div style="display: flex; gap: 15px;">
            <button class="btn" onclick="closePreview()">Cancel</button>
            <button class="btn primary" onclick="confirmSave()">Save to Rust</button>
        </div>
    </div>
    <header class="header">
        <div class="logo">RUST EMBLEM EDITOR</div>
        <div class="status" id="statusBadge">Not Connected</div>
    </header>
    <main class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header">Decal Library</div>
            <div class="category-tabs">
                <div class="cat-tab active" onclick="showCategory('basic')">Basic</div>
                <div class="cat-tab" onclick="showCategory('military')">Military</div>
                <div class="cat-tab" onclick="showCategory('symbols')">Symbols</div>
                <div class="cat-tab" onclick="showCategory('badges')">Badges</div>
                <div class="cat-tab" onclick="showCategory('weapons')">Weapons</div>
                <div class="cat-tab" onclick="showCategory('animals')">Animals</div>
            </div>
            <div class="shape-grid" id="shapeGrid"></div>
        </aside>
        <section class="canvas-area">
            <div class="toolbar">
                <div class="tool-group">
                    <span class="tool-label">Fill</span>
                    <input type="color" id="fillColor" value="#ffffff" onchange="updateFill(this.value)">
                </div>
                <div class="tool-group">
                    <span class="tool-label">Stroke</span>
                    <input type="color" id="strokeColor" value="#000000" onchange="updateStroke(this.value)">
                    <input type="number" id="strokeWidth" value="0" min="0" max="20" style="width:40px" onchange="updateStrokeWidth(this.value)">
                </div>
                <div class="tool-group">
                    <span class="tool-label">Opacity</span>
                    <input type="range" id="opacitySlider" min="0" max="100" value="100" onchange="updateOpacity(this.value)">
                </div>
                <div class="tool-group">
                    <span class="tool-label">BG</span>
                    <input type="color" id="bgColor" value="#000000" onchange="canvas.backgroundColor=this.value;canvas.renderAll()">
                </div>
            </div>
            <div class="toolbar">
                <button class="btn" onclick="undo()">↶ Undo</button>
                <button class="btn" onclick="redo()">↷ Redo</button>
                <button class="btn" onclick="bringForward()">▲</button>
                <button class="btn" onclick="sendBackward()">▼</button>
                <button class="btn" onclick="duplicateObj()">⧉ Clone</button>
                <button class="btn" onclick="flipH()">↔</button>
                <button class="btn" onclick="flipV()">↕</button>
                <button class="btn" onclick="deleteObj()">🗑</button>
                <input type="file" id="imageUpload" accept="image/*" onchange="uploadImage(event)">
                <button class="btn" onclick="document.getElementById('imageUpload').click()">📷 Image</button>
                <button class="btn" onclick="addText()">✏ Text</button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="c" width="1133" height="207"></canvas>
            </div>
            <div class="toolbar" style="margin-top:15px">
                <button class="btn" onclick="saveLocal()">💾 Save Local</button>
                <button class="btn" onclick="loadLocal()">📂 Load Local</button>
                <button class="btn" onclick="clearCanvas()">🗑 Clear All</button>
                <button class="btn primary" onclick="previewSave()">SAVE TO RUST</button>
            </div>
        </section>
        <aside class="right-panel">
            <div class="panel-section">
                <div class="panel-title">Properties</div>
                <div class="prop-row">
                    <span class="prop-label">X</span>
                    <input type="number" class="prop-input" id="propX" onchange="updatePos()">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Y</span>
                    <input type="number" class="prop-input" id="propY" onchange="updatePos()">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Width</span>
                    <input type="number" class="prop-input" id="propW" onchange="updateSize()">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Height</span>
                    <input type="number" class="prop-input" id="propH" onchange="updateSize()">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Rotation</span>
                    <input type="number" class="prop-input" id="propAngle" onchange="updateAngle()">
                </div>
            </div>
            <div class="sidebar-header">Layers</div>
            <div class="layers-list" id="layersList"></div>
        </aside>
    </main>

        window.onload = function() {

                document.getElementById('statusBadge').innerText = 'Connected: ' + steamId;
                document.getElementById('statusBadge').classList.add('connected');

            showCategory('basic');

        };
        const canvas = new fabric.Canvas('c', { preserveObjectStacking: true, backgroundColor: '#000000' });
        canvas.on('selection:created', function() { updateLayers(); syncProps(); });
        canvas.on('selection:updated', function() { updateLayers(); syncProps(); });
        canvas.on('selection:cleared', function() { updateLayers(); });
        canvas.on('object:modified', function() { updateLayers(); syncProps(); saveHistory(); });
        canvas.on('object:added', function() { if(!historyLock) saveHistory(); });
        canvas.on('object:removed', function() { if(!historyLock) saveHistory(); });
        function showCategory(cat) {
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            const grid = document.getElementById('shapeGrid');
            grid.innerHTML = '';
            (shapes[cat] || []).forEach(s => {
                const btn = document.createElement('div');
                btn.className = 'shape-btn';
                btn.title = s.n;
                btn.innerHTML = '<svg viewBox="0 0 512 512"><path d="'+s.p+'"/></svg>';
                btn.onclick = () => addShape(s.p, s.n);
                grid.appendChild(btn);
            });
        }
        function addShape(path, name) {
            const color = document.getElementById('fillColor').value;
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="'+path+'" fill="'+color+'"/></svg>';
            fabric.loadSVGFromString(svg, function(objs, opts) {
                const obj = fabric.util.groupSVGElements(objs, opts);
                obj.set({ left: canvas.width/2, top: canvas.height/2, originX: 'center', originY: 'center', scaleX: 0.15, scaleY: 0.15, fill: color, layerName: name });
                canvas.add(obj);
                canvas.setActiveObject(obj);
                canvas.renderAll();
                updateLayers();
            });
        }
        function addText() {
            const txt = new fabric.IText('TEXT', {
                left: canvas.width/2, top: canvas.height/2, originX: 'center', originY: 'center',
                fontSize: 40, fill: document.getElementById('fillColor').value, fontFamily: 'Arial Black', layerName: 'Text'
            });
            canvas.add(txt);
            canvas.setActiveObject(txt);
            canvas.renderAll();
            updateLayers();
        }
        function uploadImage(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                fabric.Image.fromURL(ev.target.result, function(img) {
                    const scale = Math.min((canvas.width*0.5)/img.width, (canvas.height*0.8)/img.height);
                    img.set({ left: canvas.width/2, top: canvas.height/2, originX: 'center', originY: 'center', scaleX: scale, scaleY: scale, layerName: 'Image' });
                    canvas.add(img);
                    canvas.setActiveObject(img);
                    canvas.renderAll();
                    updateLayers();
                });
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }
        function updateLayers() {
            const list = document.getElementById('layersList');
            list.innerHTML = '';
            const objs = canvas.getObjects();
            if(!objs.length) { list.innerHTML = '<div style="padding:20px;text-align:center;color:#555">No layers</div>'; return; }
            for(let i = objs.length-1; i >= 0; i--) {
                const o = objs[i];
                const active = canvas.getActiveObject() === o;
                const item = document.createElement('div');
                item.className = 'layer-item' + (active ? ' active' : '');
                item.onclick = function(e) { if(e.target.tagName==='BUTTON') return; canvas.setActiveObject(o); canvas.renderAll(); updateLayers(); syncProps(); };
                const icon = document.createElement('div');
                icon.className = 'layer-icon';
                icon.style.backgroundColor = o.fill || '#444';
                const name = document.createElement('span');
                name.className = 'layer-name';
                name.innerText = o.layerName || 'Layer ' + i;
                const btns = document.createElement('div');
                btns.className = 'layer-btns';
                const up = document.createElement('button'); up.className = 'mini-btn'; up.innerText = '▲';
                up.onclick = () => { canvas.bringForward(o); updateLayers(); };
                const dn = document.createElement('button'); dn.className = 'mini-btn'; dn.innerText = '▼';
                dn.onclick = () => { canvas.sendBackwards(o); updateLayers(); };
                const del = document.createElement('button'); del.className = 'mini-btn del'; del.innerText = '✕';
                del.onclick = () => { canvas.remove(o); updateLayers(); };
                btns.appendChild(up); btns.appendChild(dn); btns.appendChild(del);
                item.appendChild(icon); item.appendChild(name); item.appendChild(btns);
                list.appendChild(item);
            }
        }
        function syncProps() {
            const o = canvas.getActiveObject();
            if(!o) return;
            if(typeof o.fill === 'string') document.getElementById('fillColor').value = o.fill;
            if(o.stroke) document.getElementById('strokeColor').value = o.stroke;
            document.getElementById('strokeWidth').value = o.strokeWidth || 0;
            document.getElementById('opacitySlider').value = (o.opacity || 1) * 100;
            document.getElementById('propX').value = Math.round(o.left || 0);
            document.getElementById('propY').value = Math.round(o.top || 0);
            document.getElementById('propW').value = Math.round((o.width || 0) * (o.scaleX || 1));
            document.getElementById('propH').value = Math.round((o.height || 0) * (o.scaleY || 1));
            document.getElementById('propAngle').value = Math.round(o.angle || 0);
        }
        function updateFill(v) { const o = canvas.getActiveObject(); if(o) { o.set('fill', v); canvas.renderAll(); updateLayers(); } }
        function updateStroke(v) { const o = canvas.getActiveObject(); if(o) { o.set('stroke', v); canvas.renderAll(); } }
        function updateStrokeWidth(v) { const o = canvas.getActiveObject(); if(o) { o.set('strokeWidth', parseInt(v)||0); canvas.renderAll(); } }
        function updateOpacity(v) { const o = canvas.getActiveObject(); if(o) { o.set('opacity', v/100); canvas.renderAll(); } }
        function updatePos() { const o = canvas.getActiveObject(); if(!o) return; o.set({ left: parseInt(document.getElementById('propX').value)||0, top: parseInt(document.getElementById('propY').value)||0 }); canvas.renderAll(); }
        function updateSize() { const o = canvas.getActiveObject(); if(!o) return; const w = parseInt(document.getElementById('propW').value)||o.width; const h = parseInt(document.getElementById('propH').value)||o.height; o.set({ scaleX: w/o.width, scaleY: h/o.height }); canvas.renderAll(); }
        function updateAngle() { const o = canvas.getActiveObject(); if(!o) return; o.set('angle', parseInt(document.getElementById('propAngle').value)||0); canvas.renderAll(); }
        function bringForward() { const o = canvas.getActiveObject(); if(o) { canvas.bringForward(o); updateLayers(); } }
        function sendBackward() { const o = canvas.getActiveObject(); if(o) { canvas.sendBackwards(o); updateLayers(); } }
        function duplicateObj() { const o = canvas.getActiveObject(); if(!o) return; o.clone(function(c) { c.set({ left: c.left+20, top: c.top+20, layerName: (o.layerName||'Shape')+' Copy' }); canvas.add(c); canvas.setActiveObject(c); canvas.renderAll(); updateLayers(); }); }
        function flipH() { const o = canvas.getActiveObject(); if(o) { o.set('flipX', !o.flipX); canvas.renderAll(); } }
        function flipV() { const o = canvas.getActiveObject(); if(o) { o.set('flipY', !o.flipY); canvas.renderAll(); } }
        function deleteObj() { const o = canvas.getActiveObject(); if(o) { canvas.remove(o); updateLayers(); } }
        function clearCanvas() { if(confirm('Clear all?')) { canvas.clear(); canvas.backgroundColor = document.getElementById('bgColor').value; canvas.renderAll(); updateLayers(); } }
        function saveHistory() { if(historyLock) return; historyIdx++; if(historyIdx < history.length) history = history.slice(0, historyIdx); history.push(JSON.stringify(canvas.toJSON(['layerName']))); if(history.length > 50) { history.shift(); historyIdx--; } }
        function undo() { if(historyIdx <= 0) return; historyIdx--; historyLock = true; canvas.loadFromJSON(history[historyIdx], function() { canvas.renderAll(); updateLayers(); historyLock = false; }); }
        function redo() { if(historyIdx >= history.length-1) return; historyIdx++; historyLock = true; canvas.loadFromJSON(history[historyIdx], function() { canvas.renderAll(); updateLayers(); historyLock = false; }); }
        function saveLocal() { localStorage.setItem('rustEmblem', JSON.stringify(canvas.toJSON(['layerName']))); alert('Saved to browser!'); }
        function loadLocal() { const d = localStorage.getItem('rustEmblem'); if(!d) { alert('No saved data'); return; } canvas.loadFromJSON(d, function() { canvas.renderAll(); updateLayers(); }); }
        function previewSave() { canvas.discardActiveObject(); canvas.requestRenderAll(); const url = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 2 }); document.getElementById('previewImg').src = url; document.getElementById('previewModal').classList.add('active'); pendingData = url; }
        function closePreview() { document.getElementById('previewModal').classList.remove('active'); pendingData = null; }
        function confirmSave() { closePreview(); saveToBridge(pendingData); }
        function saveToBridge(data) {
            let id = steamId;
            if(!id) id = prompt('Enter your Steam64 ID:');
            if(!id) return;
            if(!data) { canvas.discardActiveObject(); canvas.requestRenderAll(); data = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 1 }); }
            document.getElementById('loadingOverlay').classList.add('active');
            fetch(BRIDGE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ steamId: id, imageData: data }) })
            .then(r => r.json())
            .then(d => { document.getElementById('loadingOverlay').classList.remove('active'); alert('Emblem saved! Use /myemblems in game.'); })
            .catch(e => { document.getElementById('loadingOverlay').classList.remove('active'); alert('Error: ' + e.message); });
        }
        document.addEventListener('keydown', function(e) {
            if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
            if(e.key==='Delete'||e.key==='Backspace') deleteObj();
            if(e.ctrlKey && e.key==='d') { e.preventDefault(); duplicateObj(); }
            if(e.ctrlKey && e.key==='z') { e.preventDefault(); undo(); }
            if(e.ctrlKey && e.key==='y') { e.preventDefault(); redo(); }
        });
    </script>
</body>
</html>
